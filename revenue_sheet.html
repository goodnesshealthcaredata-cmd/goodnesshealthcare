<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Data Table View</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js">
    </script>
    <style>
        :root {
            --primary: #09637E;
            --primary-dark: #064a5f;
            --primary-light: #0a7a9b;
            --secondary: #088395;
            --secondary-light: #0a9db3;
            --accent: #7AB2B2;
            --accent-light: #9cc7c7;
            --bg-light: #EBF4F6;
            --bg-white: #ffffff;
            --text-dark: #1a2e35;
            --text-medium: #4a6a73;
            --text-light: #7a9aa3;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
            --shadow-hover: 0 12px 32px rgba(0, 0, 0, 0.15);
            --radius-sm: 0.5rem;
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --radius-xl: 1.25rem;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-light);
            padding: 20px;
            color: var(--text-dark);
        }

        .app-container {
            max-width: 100%;
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 24px;
            margin: 0 auto;
        }

        /* Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--bg-light);
        }

        .app-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-header h1 span {
            background: var(--primary);
            color: white;
            font-size: 14px;
            padding: 2px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-secondary {
            background: var(--bg-light);
            color: var(--text-medium);
        }
        .btn-secondary:hover {
            background: #d5e6ea;
            transform: translateY(-1px);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }
        .btn-success:hover {
            background: #059669;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-danger {
            background: var(--error);
            color: white;
        }
        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }
        .btn-warning:hover {
            background: #d97706;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 11px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            padding: 12px 16px;
            background: var(--bg-light);
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
        }

        .stats-bar span {
            font-size: 13px;
            color: var(--text-medium);
        }

        .stats-bar strong {
            color: var(--text-dark);
            font-weight: 600;
        }

        /* Filters Row */
        .filters-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
            padding: 12px 16px;
            background: var(--bg-light);
            border-radius: var(--radius-sm);
        }

        .filters-row .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filters-row label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-medium);
            white-space: nowrap;
        }

        .filters-row input,
        .filters-row select {
            padding: 4px 8px;
            border: 1px solid #d1d9dd;
            border-radius: var(--radius-sm);
            font-size: 12px;
            background: white;
            transition: var(--transition);
            min-width: 120px;
        }

        .filters-row input:focus,
        .filters-row select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(9, 99, 126, 0.1);
        }

        .filters-row input[type="date"] {
            min-width: 140px;
        }

        .search-input-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-input-wrapper input {
            width: 100%;
            padding: 6px 12px 6px 32px;
            border: 1px solid #d1d9dd;
            border-radius: var(--radius-sm);
            font-size: 13px;
            background: white;
            transition: var(--transition);
        }

        .search-input-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(9, 99, 126, 0.1);
        }

        .search-input-wrapper .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 14px;
        }

        /* Highlight */
        .highlight-match {
            background: #ffeb3b;
            padding: 0 1px;
            border-radius: 2px;
            font-weight: 600;
        }

        /* Column Visibility Toggle */
        .column-toggle-container {
            position: relative;
            display: inline-block;
        }

        .column-toggle-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            border: 1px solid #d1d9dd;
            border-radius: var(--radius-sm);
            box-shadow: var(--shadow-lg);
            padding: 12px 16px;
            min-width: 220px;
            max-height: 350px;
            overflow-y: auto;
            z-index: 100;
            margin-top: 4px;
        }

        .column-toggle-dropdown.show {
            display: block;
        }

        .column-toggle-dropdown .toggle-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            font-size: 13px;
            color: var(--text-medium);
            cursor: pointer;
            transition: var(--transition);
        }

        .column-toggle-dropdown .toggle-item:hover {
            color: var(--text-dark);
        }

        .column-toggle-dropdown .toggle-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .column-toggle-dropdown .toggle-all {
            border-bottom: 1px solid var(--bg-light);
            padding-bottom: 8px;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-dark);
        }

        /* Summary Totals */
        .summary-totals {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 24px;
            padding: 12px 16px;
            background: var(--bg-light);
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            font-size: 13px;
            border: 1px solid #d1d9dd;
        }

        .summary-totals .total-item {
            display: flex;
            align-items: baseline;
            gap: 4px;
            white-space: nowrap;
        }

        .summary-totals .total-item .label {
            font-weight: 500;
            color: var(--text-medium);
        }

        .summary-totals .total-item .value {
            font-weight: 600;
            color: var(--text-dark);
            font-family: 'Courier New', monospace;
        }

        .summary-totals .total-item .value.profit {
            color: var(--success);
        }

        .summary-totals .total-item .value.loss {
            color: var(--error);
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
            border: 1px solid #d1d9dd;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 800px;
        }

        thead {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            background: var(--bg-light);
            padding: 8px 10px;
            text-align: left;
            font-weight: 600;
            color: var(--text-dark);
            border: 1px solid #d1d9dd;
            white-space: nowrap;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            position: sticky;
            top: 0;
            z-index: 10;
            min-width: 80px;
        }

        td {
            padding: 6px 10px;
            border: 1px solid #d1d9dd;
            vertical-align: middle;
            max-width: 200px;
            word-wrap: break-word;
            font-size: 12px;
            color: var(--text-medium);
        }

        tr:hover td {
            background: #f8fbfc;
        }

        /* Column Widths */
        .col-visitDate { min-width: 90px; max-width: 110px; }
        .col-patientName { min-width: 120px; max-width: 180px; }
        .col-center { min-width: 80px; max-width: 120px; }
        .col-careOfPerson { min-width: 100px; max-width: 160px; }
        .col-totalMRP,
        .col-totalB2B,
        .col-finalPrice,
        .col-cashReceived,
        .col-onlineReceived,
        .col-pendingPayment,
        .col-goodwillCharges,
        .col-estimatedProfit,
        .col-actualProfit {
            min-width: 80px;
            max-width: 110px;
            text-align: right;
        }

        .header-filter {
            display: block;
            width: 100%;
            padding: 2px 4px;
            border: 1px solid #d1d9dd;
            border-radius: 3px;
            font-size: 10px;
            background: white;
            margin-top: 2px;
            max-width: 120px;
        }

        .header-filter:focus {
            outline: none;
            border-color: var(--primary);
        }

        .currency {
            font-weight: 500;
            font-family: 'Courier New', monospace;
        }

        .truncate {
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .truncate:hover {
            white-space: normal;
            overflow: visible;
            background: white;
            position: relative;
            z-index: 5;
            box-shadow: var(--shadow-sm);
            padding: 2px 6px;
            border-radius: 3px;
        }

        /* Pagination */
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px 0;
            border-top: 1px solid var(--bg-light);
        }

        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pagination-controls button {
            padding: 4px 12px;
            border: 1px solid #d1d9dd;
            border-radius: var(--radius-sm);
            background: white;
            cursor: pointer;
            font-size: 12px;
            transition: var(--transition);
            color: var(--text-medium);
        }

        .pagination-controls button:hover:not(:disabled) {
            background: var(--bg-light);
            border-color: var(--primary);
            color: var(--primary);
        }

        .pagination-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-controls button.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .pagination-controls .page-info {
            font-size: 13px;
            color: var(--text-medium);
            padding: 0 8px;
        }

        .per-page-select {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .per-page-select label {
            font-size: 12px;
            color: var(--text-medium);
        }

        .per-page-select select {
            padding: 4px 8px;
            border: 1px solid #d1d9dd;
            border-radius: var(--radius-sm);
            font-size: 12px;
            background: white;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }

        .loading-spinner {
            display: inline-block;
            width: 36px;
            height: 36px;
            border: 3px solid var(--bg-light);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            color: white;
            font-weight: 500;
            z-index: 10000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            box-shadow: var(--shadow-lg);
        }

        .toast.show {
            opacity: 1;
        }

        .toast.success {
            background: var(--success);
        }
        .toast.error {
            background: var(--error);
        }
        .toast.info {
            background: var(--primary);
        }

        /* Scrollbar */
        .table-wrapper::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .table-wrapper::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 3px;
        }

        .table-wrapper::-webkit-scrollbar-thumb {
            background: #c1c7cd;
            border-radius: 3px;
        }

        .table-wrapper::-webkit-scrollbar-thumb:hover {
            background: #a0a7ae;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .app-container {
                padding: 12px;
            }
            .app-header h1 {
                font-size: 18px;
            }
            .app-header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-actions {
                justify-content: center;
            }
            .filters-row {
                flex-direction: column;
                align-items: stretch;
            }
            .filters-row .filter-group {
                flex-wrap: wrap;
            }
            .search-input-wrapper {
                min-width: 100%;
            }
            .stats-bar {
                font-size: 12px;
                gap: 12px;
                padding: 8px 12px;
            }
            .pagination-container {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .pagination-controls {
                justify-content: center;
                flex-wrap: wrap;
            }
            .column-toggle-dropdown {
                left: auto;
                right: 0;
                min-width: 180px;
            }
            .summary-totals {
                font-size: 12px;
                gap: 8px 16px;
                padding: 8px 12px;
            }
            .summary-totals .total-item {
                white-space: normal;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <h1>
                📋 Patient Data
                <span id="recordBadge">0</span>
            </h1>
            <div class="header-actions">
                <button class="btn btn-secondary" id="refreshBtn">⟳ Refresh</button>
                <div class="column-toggle-container">
                    <button class="btn btn-primary" id="toggleColumnsBtn">📊 Columns</button>
                    <div class="column-toggle-dropdown" id="columnToggleDropdown">
                        <div class="toggle-item toggle-all">
                            <input type="checkbox" id="toggleAllColumns" checked />
                            <label for="toggleAllColumns"><strong>Select All</strong></label>
                        </div>
                        <div id="columnToggleList"></div>
                    </div>
                </div>
                <button class="btn btn-success" id="exportBtn">📥 Export CSV</button>
                <button class="btn btn-warning" id="clearFiltersBtn">✕ Clear Filters</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-bar">
            <span>Total Records: <strong id="totalRecords">0</strong></span>
            <span>Filtered: <strong id="filteredRecords">0</strong></span>
            <span>Showing: <strong id="showingRecords">0</strong></span>
        </div>

        <!-- Filters -->
        <div class="filters-row" id="filtersRow">
            <div class="search-input-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="globalSearch" placeholder="Search across all columns..." />
            </div>
            <div class="filter-group">
                <label>From:</label>
                <input type="date" id="filterFromDate" />
            </div>
            <div class="filter-group">
                <label>To:</label>
                <input type="date" id="filterToDate" />
            </div>
        </div>

        <!-- Summary Totals -->
        <div class="summary-totals" id="summaryTotals">
            <!-- dynamically populated -->
        </div>

        <!-- Loading -->
        <div id="loadingIndicator" class="loading">
            <div class="loading-spinner"></div>
            <p style="margin-top:12px;">Loading patient data...</p>
        </div>

        <!-- Table -->
        <div class="table-wrapper" id="tableWrapper" style="display:none;">
            <table id="dataTable">
                <thead id="tableHead">
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination-container" id="paginationContainer">
            <div class="per-page-select">
                <label>Entries per page:</label>
                <select id="perPageSelect">
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="75">75</option>
                    <option value="100">100</option>
                </select>
            </div>
            <div class="pagination-controls" id="paginationControls">
                <button id="prevPageBtn">◀ Prev</button>
                <span class="page-info" id="pageInfo">Page 1 of 1</span>
                <button id="nextPageBtn">Next ▶</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  FIREBASE CONFIGURATION
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBYvXfJIVRQSFgXp50sGegSN5U8xq88C3g",
            authDomain: "goodness-data.firebaseapp.com",
            databaseURL: "https://goodness-data-default-rtdb.firebaseio.com",
            projectId: "goodness-data",
            storageBucket: "goodness-data.firebasestorage.app",
            messagingSenderId: "1034454680105",
            appId: "1:1034454680105:web:74727c22489373383b9238",
            measurementId: "G-TD30ZYVDCG"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ============================================================
        //  LAB NAMES (kept for potential search, but not displayed)
        // ============================================================
        const LAB_NAMES = {
            1: 'Dr. Ajay Shah',
            2: 'Dr. Jariwala',
            3: 'General Diagnostics',
            4: 'Trucheck Diagnostics'
        };

        // ============================================================
        //  COLUMN DEFINITIONS (only requested columns + new ones)
        // ============================================================
        const COLUMNS = [
            { key: 'visitDate', label: 'Visit Date', visible: true, widthClass: 'col-visitDate' },
            { key: 'patientName', label: 'Patient Name', visible: true, filterable: true, widthClass: 'col-patientName' },
            { key: 'center', label: 'Center', visible: true, filterable: true, widthClass: 'col-center' },
            { key: 'careOfPerson', label: 'Care of Person', visible: true, filterable: true, widthClass: 'col-careOfPerson' },
            { key: 'totalMRP', label: 'Total MRP', visible: true, widthClass: 'col-totalMRP' },
            { key: 'totalB2B', label: 'Total B2B', visible: true, widthClass: 'col-totalB2B' },
            { key: 'finalPrice', label: 'Final Price', visible: true, widthClass: 'col-finalPrice' },
            { key: 'cashReceived', label: 'Cash Received', visible: true, widthClass: 'col-cashReceived' },
            { key: 'onlineReceived', label: 'Online Received', visible: true, widthClass: 'col-onlineReceived' },
            { key: 'pendingPayment', label: 'Pending Payment', visible: true, widthClass: 'col-pendingPayment' },
            { key: 'goodwillCharges', label: 'Goodwill Charges', visible: true, widthClass: 'col-goodwillCharges' },
            { key: 'estimatedProfit', label: 'Estimated Profit', visible: true, widthClass: 'col-estimatedProfit' },
            { key: 'actualProfit', label: 'Actual Profit', visible: true, widthClass: 'col-actualProfit' }
        ];

        // ============================================================
        //  STATE
        // ============================================================
        let allPatients = [];
        let filteredPatients = [];
        let displayedPatients = [];
        let isLoading = true;
        let searchTerm = '';

        // Pagination
        let currentPage = 1;
        let perPage = 25;

        // Column visibility
        let columnVisibility = {};
        COLUMNS.forEach(c => columnVisibility[c.key] = c.visible);

        // Column filters (only for filterable columns)
        let columnFilters = {};
        COLUMNS.forEach(c => {
            if (c.filterable) columnFilters[c.key] = 'all';
        });

        let dateFrom = '';
        let dateTo = '';

        // ============================================================
        //  DOM REFS
        // ============================================================
        const tableHead = document.getElementById('tableHead');
        const tableBody = document.getElementById('tableBody');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const tableWrapper = document.getElementById('tableWrapper');
        const refreshBtn = document.getElementById('refreshBtn');
        const exportBtn = document.getElementById('exportBtn');
        const clearFiltersBtn = document.getElementById('clearFiltersBtn');
        const toggleColumnsBtn = document.getElementById('toggleColumnsBtn');
        const columnToggleDropdown = document.getElementById('columnToggleDropdown');
        const columnToggleList = document.getElementById('columnToggleList');
        const toggleAllColumns = document.getElementById('toggleAllColumns');
        const globalSearch = document.getElementById('globalSearch');
        const filterFromDate = document.getElementById('filterFromDate');
        const filterToDate = document.getElementById('filterToDate');
        const totalRecords = document.getElementById('totalRecords');
        const filteredRecords = document.getElementById('filteredRecords');
        const showingRecords = document.getElementById('showingRecords');
        const recordBadge = document.getElementById('recordBadge');
        const perPageSelect = document.getElementById('perPageSelect');
        const prevPageBtn = document.getElementById('prevPageBtn');
        const nextPageBtn = document.getElementById('nextPageBtn');
        const pageInfo = document.getElementById('pageInfo');
        const toastEl = document.getElementById('toast');
        const summaryTotals = document.getElementById('summaryTotals');

        // ============================================================
        //  TOAST
        // ============================================================
        function toast(msg, type = 'success') {
            toastEl.textContent = msg;
            toastEl.className = 'toast show ' + type;
            clearTimeout(toastEl._timeout);
            toastEl._timeout = setTimeout(() => toastEl.classList.remove('show'), 3000);
        }

        // ============================================================
        //  ESCAPE HTML
        // ============================================================
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        //  HIGHLIGHT TEXT
        // ============================================================
        function highlightText(text, searchTerm) {
            if (text === null || text === undefined) return '';
            text = String(text);
            if (!searchTerm || searchTerm.trim() === '') {
                return escapeHtml(text);
            }
            const term = String(searchTerm).trim();
            if (!term) return escapeHtml(text);
            const lowerText = text.toLowerCase();
            const lowerTerm = term.toLowerCase();
            if (!lowerText.includes(lowerTerm)) {
                return escapeHtml(text);
            }
            let result = '';
            let lastIndex = 0;
            let index = lowerText.indexOf(lowerTerm);
            while (index !== -1) {
                result += escapeHtml(text.substring(lastIndex, index));
                result += `<span class="highlight-match">${escapeHtml(text.substring(index, index + term.length))}</span>`;
                lastIndex = index + term.length;
                index = lowerText.indexOf(lowerTerm, lastIndex);
            }
            result += escapeHtml(text.substring(lastIndex));
            return result;
        }

        // ============================================================
        //  GET LABS (kept for search; not displayed)
        // ============================================================
        function getLabsForEntry(entry) {
            if (!entry) return [];
            const labs = [];
            if (entry.labs && Array.isArray(entry.labs)) {
                entry.labs.forEach(lab => {
                    const numLab = Number(lab);
                    if (!isNaN(numLab) && numLab >= 1 && numLab <= 4 && !labs.includes(numLab)) {
                        labs.push(numLab);
                    }
                });
                if (labs.length > 0) return labs;
            }
            if (entry.labSelections && typeof entry.labSelections === 'object') {
                for (let labId = 1; labId <= 4; labId++) {
                    const labData = entry.labSelections[labId];
                    if (labData && typeof labData === 'object') {
                        const hasTests = Array.isArray(labData.tests) && labData.tests.length > 0;
                        const hasPackages = Array.isArray(labData.packages) && labData.packages.length > 0;
                        if (hasTests || hasPackages) {
                            labs.push(labId);
                        }
                    }
                }
                if (labs.length > 0) return labs;
            }
            for (let labId = 1; labId <= 4; labId++) {
                const key = labId.toString();
                if (entry[key] && typeof entry[key] === 'object') {
                    const labData = entry[key];
                    const hasTests = Array.isArray(labData.tests) && labData.tests.length > 0;
                    const hasPackages = Array.isArray(labData.packages) && labData.packages.length > 0;
                    if (hasTests || hasPackages) {
                        labs.push(labId);
                    }
                }
            }
            return [...new Set(labs)];
        }

        // ============================================================
        //  GET COLUMN VALUE (including computed profits)
        // ============================================================
        function getColumnValue(patient, key) {
            switch (key) {
                case 'visitDate': return patient.visitDate || '';
                case 'patientName': return patient.patientName || '';
                case 'center': return patient.center || '';
                case 'careOfPerson': return patient.careOfPerson || '';
                case 'totalMRP': return patient.totalMRP || 0;
                case 'totalB2B': return patient.totalB2B || 0;
                case 'finalPrice': return patient.finalPrice || 0;
                case 'cashReceived': return patient.cashReceived || 0;
                case 'onlineReceived': return patient.onlineReceived || 0;
                case 'pendingPayment': return patient.pendingPayment || 0;
                case 'goodwillCharges': return patient.goodwillCharges || 0;
                case 'estimatedProfit': {
                    const finalPrice = patient.finalPrice || 0;
                    const b2b = patient.totalB2B || 0;
                    const goodwill = patient.goodwillCharges || 0;
                    return finalPrice - b2b - goodwill;
                }
                case 'actualProfit': {
                    const cash = patient.cashReceived || 0;
                    const online = patient.onlineReceived || 0;
                    const b2b = patient.totalB2B || 0;
                    const goodwill = patient.goodwillCharges || 0;
                    return (cash + online) - b2b - goodwill;
                }
                default: return '';
            }
        }

        // ============================================================
        //  FORMAT CURRENCY
        // ============================================================
        function formatCurrency(value) {
            if (value === undefined || value === null || isNaN(value)) return '₹0';
            return '₹' + Number(value).toLocaleString('en-IN', {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            });
        }

        // ============================================================
        //  LOAD DATA
        // ============================================================
        async function loadData() {
            isLoading = true;
            loadingIndicator.style.display = 'block';
            tableWrapper.style.display = 'none';

            try {
                const snap = await db.ref('patients').once('value');
                const data = snap.val();

                allPatients = [];

                if (data) {
                    const keys = Object.keys(data);
                    for (const key of keys) {
                        const patient = data[key];
                        patient._firebaseKey = key;
                        allPatients.push(patient);
                    }

                    allPatients.sort((a, b) => {
                        const dateA = a.visitDate || '';
                        const dateB = b.visitDate || '';
                        return dateB.localeCompare(dateA);
                    });
                }

                console.log('[Table] Loaded', allPatients.length, 'patients');
                totalRecords.textContent = allPatients.length;

                buildColumnToggleList();

                applyFilters();
                toast('Data loaded successfully!', 'success');

            } catch (err) {
                console.error('Error loading data:', err);
                toast('Error loading data: ' + err.message, 'error');
            } finally {
                isLoading = false;
                loadingIndicator.style.display = 'none';
                tableWrapper.style.display = 'block';
            }
        }

        // ============================================================
        //  BUILD COLUMN TOGGLE LIST
        // ============================================================
        function buildColumnToggleList() {
            let html = '';
            COLUMNS.forEach(col => {
                html += `
                    <div class="toggle-item">
                        <input type="checkbox" id="col_${col.key}" ${columnVisibility[col.key] ? 'checked' : ''} />
                        <label for="col_${col.key}">${col.label}</label>
                    </div>
                `;
            });
            columnToggleList.innerHTML = html;

            columnToggleList.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', function() {
                    const key = this.id.replace('col_', '');
                    columnVisibility[key] = this.checked;
                    updateToggleAllState();
                    renderTable();
                    // summary totals don't depend on column visibility
                });
            });
        }

        function updateToggleAllState() {
            const allChecked = COLUMNS.every(col => columnVisibility[col.key]);
            toggleAllColumns.checked = allChecked;
        }

        // ============================================================
        //  APPLY FILTERS
        // ============================================================
        function applyFilters() {
            let result = [...allPatients];

            // Global search - search all patient data (including labs)
            if (searchTerm && searchTerm.trim() !== '') {
                const term = searchTerm.toLowerCase().trim();
                result = result.filter(p => {
                    // Collect all normal patient fields
                    const searchableValues = [
                        p._firebaseKey,
                        p.patientName,
                        p.visitDate,
                        p.age,
                        p.gender,
                        p.doctorName,
                        p.careOfPerson,
                        p.address,
                        p.center,
                        p.visitType,
                        p.visitTime,
                        p.ppTime,
                        p.phlebotomist,
                        p.ppPhlebotomist,
                        p.extraCollectionTime,
                        p.extraCollectionPhlebotomist,
                        p.totalMRP,
                        p.totalB2B,
                        p.finalPrice,
                        p.cashReceived,
                        p.onlineReceived,
                        p.pendingPayment,
                        p.goodwillCharges
                    ];

                    // Add lab names and tests
                    const labs = getLabsForEntry(p);
                    labs.forEach(labId => {
                        searchableValues.push(LAB_NAMES[labId] || 'Lab ' + labId);
                        // Add all tests/packages for this lab (we don't have a direct function to extract all tests here, but we can try)
                        // Use a simple extraction for search: we can stringify lab data
                        const labData = p.labSelections ? p.labSelections[labId] : p[labId];
                        if (labData) {
                            const tests = labData.tests || [];
                            const packages = labData.packages || [];
                            tests.forEach(t => searchableValues.push(t.generalName || t.name || 'Test'));
                            packages.forEach(pkg => {
                                searchableValues.push(pkg.packageName || 'Package');
                                if (pkg.tests) {
                                    pkg.tests.forEach(t => {
                                        if (t.selected !== false) {
                                            searchableValues.push(t.generalName || t.name || 'Test');
                                        }
                                    });
                                }
                            });
                        }
                    });

                    const searchableText = searchableValues
                        .filter(value => value !== null && value !== undefined)
                        .map(value => String(value))
                        .join(' ')
                        .toLowerCase();

                    return searchableText.includes(term);
                });
            }

            // Date range
            if (dateFrom) {
                result = result.filter(p => (p.visitDate || '') >= dateFrom);
            }
            if (dateTo) {
                result = result.filter(p => (p.visitDate || '') <= dateTo);
            }

            // Column filters (only for filterable columns)
            COLUMNS.forEach(col => {
                if (col.filterable && columnFilters[col.key] && columnFilters[col.key] !== 'all') {
                    const filterValue = columnFilters[col.key];
                    result = result.filter(p => {
                        let value = getColumnValue(p, col.key);
                        return String(value) === filterValue;
                    });
                }
            });

            filteredPatients = result;
            filteredRecords.textContent = filteredPatients.length;

            currentPage = 1;
            updatePagination();
            renderTable();
            updateStats();
            updateSummaryTotals();  // new: update summary totals based on filteredPatients
        }

        // ============================================================
        //  UPDATE PAGINATION
        // ============================================================
        function updatePagination() {
            const totalPages = Math.ceil(filteredPatients.length / perPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * perPage;
            const end = Math.min(start + perPage, filteredPatients.length);
            displayedPatients = filteredPatients.slice(start, end);

            pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
            prevPageBtn.disabled = currentPage <= 1;
            nextPageBtn.disabled = currentPage >= totalPages;

            showingRecords.textContent = displayedPatients.length;
            recordBadge.textContent = filteredPatients.length;
        }

        // ============================================================
        //  RENDER TABLE
        // ============================================================
        function renderTable() {
            // Build header
            let headerHtml = '<tr>';
            COLUMNS.forEach(col => {
                if (columnVisibility[col.key]) {
                    headerHtml += `<th class="${col.widthClass || ''}">
                        ${col.label}
                        ${col.filterable ? buildFilterDropdown(col.key) : ''}
                    </th>`;
                }
            });
            headerHtml += '</tr>';
            tableHead.innerHTML = headerHtml;

            // Re-bind filter events
            COLUMNS.forEach(col => {
                if (col.filterable) {
                    const filterEl = document.getElementById(`filter_${col.key}`);
                    if (filterEl) {
                        filterEl.addEventListener('change', function() {
                            columnFilters[col.key] = this.value;
                            applyFilters();
                        });
                    }
                }
            });

            // Build body
            if (displayedPatients.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="${COLUMNS.filter(c => columnVisibility[c.key]).length}" style="text-align:center;padding:40px;color:var(--text-light);">
                            No patient records found.
                        </td>
                    </tr>
                `;
                return;
            }

            let bodyHtml = '';
            displayedPatients.forEach((patient, idx) => {
                bodyHtml += '<tr>';
                COLUMNS.forEach(col => {
                    if (columnVisibility[col.key]) {
                        let value = getColumnValue(patient, col.key);
                        let displayValue = '';

                        if (col.key === 'visitDate' || col.key === 'patientName' || col.key === 'center' || col.key === 'careOfPerson') {
                            displayValue = highlightText(String(value), searchTerm);
                            // Truncate for long text
                            if (col.key === 'patientName' || col.key === 'careOfPerson') {
                                displayValue = `<span class="truncate" title="${escapeHtml(String(value))}">${displayValue || '—'}</span>`;
                            }
                        } else if (col.key === 'totalMRP' || col.key === 'totalB2B' || col.key === 'finalPrice' ||
                                   col.key === 'cashReceived' || col.key === 'onlineReceived' || col.key === 'pendingPayment' ||
                                   col.key === 'goodwillCharges' || col.key === 'estimatedProfit' || col.key === 'actualProfit') {
                            const formatted = formatCurrency(value);
                            const isPending = col.key === 'pendingPayment' && value > 0;
                            const isProfit = (col.key === 'estimatedProfit' || col.key === 'actualProfit');
                            const profitClass = (isProfit && value < 0) ? 'loss' : (isProfit && value >= 0 ? 'profit' : '');
                            displayValue = `<span class="currency ${isPending ? 'text-error' : ''} ${profitClass}">${formatted}</span>`;
                        } else {
                            displayValue = highlightText(String(value), searchTerm);
                        }

                        bodyHtml += `<td class="${col.widthClass || ''}">${displayValue || '—'}</td>`;
                    }
                });
                bodyHtml += '</tr>';
            });

            tableBody.innerHTML = bodyHtml;
        }

        // ============================================================
        //  BUILD FILTER DROPDOWN
        // ============================================================
        function buildFilterDropdown(colKey) {
            const values = new Set();
            allPatients.forEach(p => {
                let val = getColumnValue(p, colKey);
                if (val && String(val).trim()) {
                    values.add(String(val).trim());
                }
            });

            const sortedValues = Array.from(values).sort();
            const currentValue = columnFilters[colKey] || 'all';

            let html = `<select class="header-filter" id="filter_${colKey}">
                <option value="all">All</option>`;
            sortedValues.forEach(v => {
                const selected = v === currentValue ? 'selected' : '';
                html += `<option value="${escapeHtml(v)}" ${selected}>${escapeHtml(v)}</option>`;
            });
            html += '</select>';
            return html;
        }

        // ============================================================
        //  UPDATE STATS
        // ============================================================
        function updateStats() {
            filteredRecords.textContent = filteredPatients.length;
            showingRecords.textContent = displayedPatients.length;
            recordBadge.textContent = filteredPatients.length;
        }

        // ============================================================
        //  UPDATE SUMMARY TOTALS (new)
        // ============================================================
        function updateSummaryTotals() {
            const moneyKeys = [
                'totalMRP', 'totalB2B', 'finalPrice', 'cashReceived', 
                'onlineReceived', 'pendingPayment', 'goodwillCharges',
                'estimatedProfit', 'actualProfit'
            ];

            const totals = {};
            moneyKeys.forEach(key => totals[key] = 0);

            filteredPatients.forEach(patient => {
                moneyKeys.forEach(key => {
                    let val = 0;
                    if (key === 'estimatedProfit' || key === 'actualProfit') {
                        val = getColumnValue(patient, key);
                    } else {
                        val = patient[key] || 0;
                    }
                    totals[key] += val;
                });
            });

            // Build summary HTML
            const labels = {
                totalMRP: 'Total MRP',
                totalB2B: 'Total B2B',
                finalPrice: 'Final Price',
                cashReceived: 'Cash Received',
                onlineReceived: 'Online Received',
                pendingPayment: 'Pending Payment',
                goodwillCharges: 'Goodwill Charges',
                estimatedProfit: 'Estimated Profit',
                actualProfit: 'Actual Profit'
            };

            let html = '';
            moneyKeys.forEach(key => {
                const value = totals[key];
                const formatted = formatCurrency(value);
                let extraClass = '';
                if (key === 'estimatedProfit' || key === 'actualProfit') {
                    extraClass = value < 0 ? 'loss' : 'profit';
                }
                html += `
                    <div class="total-item">
                        <span class="label">${labels[key]}:</span>
                        <span class="value ${extraClass}">${formatted}</span>
                    </div>
                `;
            });

            summaryTotals.innerHTML = html;
        }

        // ============================================================
        //  EXPORT CSV
        // ============================================================
        function exportCSV() {
            if (filteredPatients.length === 0) {
                toast('No data to export.', 'error');
                return;
            }

            const visibleCols = COLUMNS.filter(c => columnVisibility[c.key]);

            let headers = visibleCols.map(c => c.label);
            let csv = headers.join(',') + '\n';

            filteredPatients.forEach(patient => {
                const row = visibleCols.map(col => {
                    let value = getColumnValue(patient, col.key);
                    if (typeof value === 'string') {
                        value = value.replace(/,/g, ';').replace(/\n/g, ' ');
                    }
                    return String(value);
                });
                csv += row.join(',') + '\n';
            });

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `patient_data_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);

            toast('CSV exported successfully!', 'success');
        }

        // ============================================================
        //  CLEAR FILTERS
        // ============================================================
        function clearAllFilters() {
            globalSearch.value = '';
            searchTerm = '';
            filterFromDate.value = '';
            filterToDate.value = '';
            dateFrom = '';
            dateTo = '';

            COLUMNS.forEach(col => {
                if (col.filterable) {
                    columnFilters[col.key] = 'all';
                    const filterEl = document.getElementById(`filter_${col.key}`);
                    if (filterEl) filterEl.value = 'all';
                }
            });

            applyFilters();
            toast('All filters cleared!', 'info');
        }

        // ============================================================
        //  EVENT LISTENERS
        // ============================================================
        globalSearch.addEventListener('input', function() {
            searchTerm = this.value;
            applyFilters();
        });

        filterFromDate.addEventListener('change', function() {
            dateFrom = this.value;
            applyFilters();
        });

        filterToDate.addEventListener('change', function() {
            dateTo = this.value;
            applyFilters();
        });

        refreshBtn.addEventListener('click', async function() {
            const originalText = this.innerHTML;
            this.innerHTML = '⏳ Loading...';
            this.disabled = true;
            await loadData();
            this.innerHTML = originalText;
            this.disabled = false;
        });

        exportBtn.addEventListener('click', exportCSV);

        clearFiltersBtn.addEventListener('click', clearAllFilters);

        toggleColumnsBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            columnToggleDropdown.classList.toggle('show');
        });

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.column-toggle-container')) {
                columnToggleDropdown.classList.remove('show');
            }
        });

        toggleAllColumns.addEventListener('change', function() {
            const checked = this.checked;
            COLUMNS.forEach(col => {
                columnVisibility[col.key] = checked;
                const cb = document.getElementById(`col_${col.key}`);
                if (cb) cb.checked = checked;
            });
            renderTable();
        });

        perPageSelect.addEventListener('change', function() {
            perPage = parseInt(this.value);
            currentPage = 1;
            updatePagination();
            renderTable();
            updateStats();
        });

        prevPageBtn.addEventListener('click', function() {
            if (currentPage > 1) {
                currentPage--;
                updatePagination();
                renderTable();
                updateStats();
            }
        });

        nextPageBtn.addEventListener('click', function() {
            const totalPages = Math.ceil(filteredPatients.length / perPage);
            if (currentPage < totalPages) {
                currentPage++;
                updatePagination();
                renderTable();
                updateStats();
            }
        });

        // ============================================================
        //  INIT
        // ============================================================
        loadData();
    </script>
</body>
</html>
